name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [app/**, .cargo/config.toml, site/logo.png, .github/workflows/windows.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: rustup update stable
      - name: Test Rust app on Windows
        run: cargo +stable test --locked --manifest-path app/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows x64 release
        run: |
          cargo +stable build --locked --release --manifest-path app/Cargo.toml --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path app/target/x86_64-pc-windows-msvc/release/TwoWindowsInOne.exe -DestinationPath dist/Two-Windows-in-One-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Two-Windows-in-One-win-x64
          path: dist/Two-Windows-in-One-win-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Two-Windows-in-One-win-x64
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" Two-Windows-in-One-win-x64.zip --verify-tag \
            --title "Two Windows in One $TAG" \
            --notes $'Сборка для Windows x64.\n\nРазработчик: qqew666.\n\n[Сайт и ключ доступа](https://two-windows-in-one-key-api.sillypetunia8.chatgpt.site/).'
