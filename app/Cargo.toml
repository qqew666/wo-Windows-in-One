[package]
name = "two-windows-in-one"
version = "2.4.0"
edition = "2024"
authors = ["qqew666"]
repository = "https://github.com/qqew666/wo-Windows-in-One"
homepage = "https://twi.wtowindowszuz.chatgpt.site/"
description = "Separate application profiles and optional Windows window embedding"

[[bin]]
name = "TwoWindowsInOne"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }

[target.'cfg(windows)'.dependencies]
semver = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
time = "0.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
